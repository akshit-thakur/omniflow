server {
    listen 80;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 250m;

    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"healthy","service":"frontend"}';
    }

    # Readiness proves the reverse proxy can reach an API that can query the
    # migrated schema. Keep /healthz as the cheap container liveness endpoint.
    location = /readyz {
        access_log off;
        proxy_pass http://api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Internal service endpoints are reachable only on the Compose network.
    location = /api/internal {
        return 404;
    }

    location /api/internal/ {
        return 404;
    }

    # Forward assistant fragments immediately so local Ollama output appears
    # in the browser as it is generated instead of being buffered by Nginx.
    location = /api/ai/agent/chat/stream {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 190s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 190s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
